name: Build & Test

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'event*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Spotless is decoupled from the build (not wired into compileJava or `check`),
      # so run spotlessCheck as an explicit step to gate formatting on JDK 17.
      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew build test

  # SpotBugs static analysis. Non-blocking (continue-on-error + the build itself uses
  # ignoreFailures): it surfaces findings via an uploaded HTML report but never fails
  # CI, so it does not block merges until the team triages.
  static-analysis:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run SpotBugs
        run: ./gradlew spotbugsMain

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/main.html
          if-no-files-found: warn
